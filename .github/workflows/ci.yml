name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + typecheck + build
    runs-on: ubuntu-latest
    env:
      # CI 里使用占位域名；真实域名由部署环境注入。
      # 切勿设为 https://paperclip.ing（官方域名）。
      SITE_URL: https://paperclip-cn.example.com

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: Lint（Biome）
        run: bun run lint

      - name: 类型检查（astro check）
        run: bun run typecheck

      - name: 生产构建
        run: bun run build

      - name: 校验关键产物存在
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/sitemap-index.xml
          grep -q "https://paperclip-cn.example.com" dist/robots.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
